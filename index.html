<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yên Tâm Học · 安心して学ぶ</title>
<style>
:root{--bg:#eef6fc;--card:#fff;--ink:#1d3557;--sub:#566b88;--blue:#4a90d9;--blue2:#dbeafb;--green:#3dae7a;--green2:#dff5ea;--sh:0 6px 20px rgba(74,144,217,.15)}
*{box-sizing:border-box}
body{margin:0;background:#dfeaf5;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;color:var(--ink)}
#app{max-width:420px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
.screen{display:none;min-height:100vh;padding:56px 20px 84px;flex-direction:column;gap:14px}
.screen.on{display:flex;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.vi{display:block;font-size:16px;font-weight:600;line-height:1.35}
.ja{display:block;font-size:13px;color:var(--sub);font-weight:400;line-height:1.35;margin-top:2px}
.big .vi{font-size:24px;font-weight:700}.big .ja{font-size:15px}.big .sm .vi{font-size:15px;font-weight:400}.big .sm .ja{font-size:13px}
.center{text-align:center}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--sh)}
.card.tap{cursor:pointer;display:flex;gap:14px;align-items:center;transition:transform .15s}
.card.tap:active{transform:scale(.97)}
.ico{font-size:38px;width:62px;height:62px;border-radius:18px;background:var(--blue2);display:flex;align-items:center;justify-content:center;flex:none}
.ico.g{background:var(--green2)}
.btn{border:0;border-radius:18px;padding:16px;font-size:16px;cursor:pointer;background:var(--blue);color:#fff;box-shadow:var(--sh);width:100%}
.btn .vi{font-size:17px}.btn .ja{color:#e6f1fc}
.btn.g{background:var(--green)}.btn.g .ja{color:#e3f7ec}
.btn:active{transform:scale(.98)}
.link{background:none;border:0;cursor:pointer;color:var(--blue);padding:8px;text-align:center;width:100%}
.link .ja{color:var(--sub)}
.sp{flex:1}
.art{font-size:80px;text-align:center;margin:6px 0}
.reset{position:absolute;bottom:14px;left:0;right:0;text-align:center}
.reset button{background:#fff;border:1px solid #c9d8e8;border-radius:999px;padding:10px 18px;font-size:14px;color:#566b88;cursor:pointer}
.reset .vi{display:inline;font-size:14px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--blue2);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;color:var(--ink)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}.chip.on .ja{color:#e6f1fc}
.chip .vi{font-size:14px}
input[type=time]{font-size:22px;padding:10px 14px;border-radius:14px;border:2px solid var(--blue2);color:var(--ink);background:#fff}
.row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.x{border:0;background:#eef2f7;border-radius:50%;width:34px;height:34px;cursor:pointer;color:var(--sub);font-size:16px}
.err{background:#fff4e0;color:#8a5a00;border-radius:14px;padding:12px;display:none}
.tt{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eef2f7;font-size:14px}
.tt:last-child{border:0}
.banner{background:var(--green2);border:2px solid #b8e6cf;color:#1f6b49;border-radius:20px;padding:14px;animation:in .5s}
.banner .ja{color:#4d9a76}
.status{display:flex;gap:12px;align-items:center}
.status.ok{background:var(--green2)}
.sim{margin-top:auto;border:1px dashed #c9d8e8;border-radius:16px;padding:10px;text-align:center;opacity:.8}
.sim .vi{font-size:12px;font-weight:400;color:var(--sub)}.sim .ja{font-size:11px}
.sim button{margin-top:6px;border:1px solid #c9d8e8;background:#fff;border-radius:12px;padding:6px 10px;color:var(--sub);cursor:pointer}
.sim button .vi{font-size:12px}
/* A4 lock screen */
#A4{background:linear-gradient(160deg,#1b2a4a,#3b5b8c);color:#fff;align-items:center;padding-top:70px}
#A4 .clock{font-size:76px;font-weight:200;letter-spacing:2px}
#A4 .date{opacity:.8;margin-bottom:30px}
.notif{width:100%;background:rgba(255,255,255,.92);color:#1d3557;border-radius:22px;padding:14px;cursor:pointer;animation:drop .7s cubic-bezier(.2,1.2,.4,1);box-shadow:0 10px 30px rgba(0,0,0,.3)}
@keyframes drop{from{transform:translateY(-140px);opacity:0}to{transform:none;opacity:1}}
.nh{display:flex;gap:8px;align-items:center;font-size:12px;color:#5b6f8a;margin-bottom:6px}
.nh b{flex:1}.nh .vi{display:inline;font-size:12px}
.hint{margin-top:18px;opacity:.75;text-align:center}.hint .ja{color:#c5d3e8}
#A4 .reset button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#e6eefb}
/* A5 */
.tabs{display:flex;gap:8px}.tab{flex:1;padding:10px;border-radius:14px;border:0;background:#fff;cursor:pointer;font-weight:700;color:var(--sub)}
.tab.on{background:var(--blue);color:#fff}
.msg{display:flex;gap:10px;margin-bottom:12px}.av{width:38px;height:38px;border-radius:50%;background:var(--blue2);display:flex;align-items:center;justify-content:center;flex:none}
.msg b{font-size:13px}.msg p{margin:3px 0 0;font-size:14px;line-height:1.4}
.fix{position:sticky;bottom:70px;margin-top:auto}
/* B */
.task{cursor:pointer;display:block}.task.done{opacity:.5}
.meta{font-size:12px;color:var(--sub);margin-top:6px}
.tag{display:inline-block;font-size:11px;border-radius:8px;padding:3px 8px;background:var(--blue2);color:var(--blue)}
.tag.d{background:var(--green2);color:var(--green)}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#1d3557;color:#fff;border-radius:14px;padding:10px 14px;max-width:360px;font-size:13px;display:none;z-index:9}
.toast .ja{color:#c5d3e8}
.bar{height:14px;background:#e3edf7;border-radius:9px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:9px;transition:width 1.2s ease}
.check{width:110px;height:110px;border-radius:50%;background:var(--green);color:#fff;font-size:64px;display:flex;align-items:center;justify-content:center;margin:10px auto;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.xp{font-size:34px;font-weight:800;color:var(--green);text-align:center;animation:bounce .8s .3s both}
@keyframes bounce{0%{transform:translateY(20px);opacity:0}60%{transform:translateY(-10px);opacity:1}100%{transform:none}}
.chart{display:flex;align-items:flex-end;gap:12px;height:140px;padding-top:10px}
.col{flex:1;text-align:center;font-size:12px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.col i{display:block;background:var(--blue2);border-radius:8px 8px 0 0;transition:height 1s}.col.me i{background:var(--green)}
.badge{display:flex;gap:12px;align-items:center;margin-bottom:10px}.badge.lock{opacity:.55}
.badge .ico{font-size:28px;width:52px;height:52px}
h3{margin:0 0 8px}h3 .vi{font-size:15px}
#lang{position:absolute;top:12px;right:14px;z-index:6;display:flex;background:rgba(255,255,255,.92);border-radius:999px;padding:3px;box-shadow:var(--sh)}
#lang button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer}
#lang button.on{background:var(--blue);color:#fff}
.tag.n{background:#eef2f7;color:#566b88}
#hid{position:absolute;top:0;left:0;width:56px;height:56px;z-index:7}
.slot input[type=time]{display:block;width:100%;margin-top:6px;font-size:30px}.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekdays .chip{padding:10px 0;border-radius:12px;font-weight:600}.quick{display:flex;margin-top:6px}.quick .link{font-size:12px}.task-form{display:flex;flex-direction:column;gap:15px}.task-form label{display:flex;flex-direction:column;gap:7px;font-size:14px;font-weight:600}.task-form input,.task-form select,.task-form textarea{font:inherit;width:100%;min-width:0;border:2px solid var(--blue2);border-radius:12px;padding:12px;background:white;color:var(--ink)}.task-form textarea{resize:vertical}.task,.big,.tt{overflow-wrap:anywhere}.msg p{white-space:pre-wrap}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #2169ac;outline-offset:3px}.btn.outline{background:transparent;border:1.5px solid var(--blue);color:var(--blue);box-shadow:none;padding:12px}.btn.outline .vi{font-size:15px}.quick{gap:12px;margin-top:9px}.quick .link{width:auto;padding:3px 0;font-size:12px}.slot{padding:14px}.slot .row{margin-bottom:12px}.slot input[type=time]{font-size:26px;padding:8px 12px}.group-title{font-size:14px;color:var(--sub);margin:10px 2px 0;font-weight:700}.channel-step{display:flex;gap:12px;align-items:center;margin:12px 0}.channel-step .ico{width:42px;height:42px;font-size:22px}.sample-preview{border:1px solid #ccdaea;border-radius:16px;padding:12px;background:rgba(255,255,255,.55)}.sample-preview summary{cursor:pointer;font-size:13px;color:var(--sub);font-weight:600}.sample-preview[open] summary{margin-bottom:14px}.sample-preview .card{margin-top:12px;box-shadow:none}.channel-step .vi{font-size:15px}</style></head><body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ===== DỮ LIỆU MẪU / SAMPLE DATA (sửa tại đây) ===== */
const APP_NAME=["Yên Tâm Học","安心して学ぶ"];
// Thời khóa biểu mẫu: day = getDay() (1=T2 ... 5=T6); remind = 30 phút trước tiết đầu
const TKB=[{d:1,n:"T2",cls:"Mạng máy tính",j:"コンピュータネットワーク",at:"07:00",rm:"06:30"},{d:2,n:"T3",cls:"Thực hành Lập trình mạng",j:"ネットワークプログラミング実習",at:"12:30",rm:"12:00"},{d:3,n:"T4",cls:"Cấu trúc dữ liệu",j:"データ構造",at:"09:00",rm:"08:30"},{d:4,n:"T5",cls:"Thiết kế ứng dụng di động",j:"モバイルアプリ設計",at:"07:00",rm:"06:30"},{d:5,n:"T6",cls:"ITSS in Japanese 2",j:"ITSS in Japanese 2",at:"09:00",rm:"08:30"}];
const DAYS=[["T2",1],["T3",2],["T4",3],["T5",4],["T6",5],["T7",6],["CN",0]];
// 6 việc mẫu (type: n=Thông báo, d=Deadline)
const TASKS=[
{id:1,t:"n",vi:"Nghỉ học môn Mạng máy tính sáng thứ Hai",ja:"月曜朝のコンピュータネットワークは休講",due:["Hạn xem: trước 06:00 thứ Hai","確認期限：月曜6:00まで"],src:"Teams",who:"Thầy Hùng",more:["Lớp sẽ được học bù vào tuần sau. Thầy sẽ báo lịch cụ thể sau.","補講は来週の予定です。詳細は後日連絡があります。"]},
{id:2,t:"n",vi:"Đổi phòng học Thực hành Lập trình mạng sang D9-301",ja:"ネットワークプログラミング実習の教室がD9-301に変更",due:["Hạn xem: trước 12:00 thứ Ba","確認期限：火曜12:00まで"],src:"Teams",who:"Cô Lan",more:["Từ tuần sau lớp học ở phòng D9-301. Các bạn nhớ đến đúng phòng mới.","来週から教室はD9-301です。新しい教室に行ってください。"]},
{id:3,t:"d",vi:"Bài tập tuần của môn Tư tưởng Hồ Chí Minh",ja:"ホー・チ・ミン思想の週課題",due:["Hạn: 23:59 Chủ nhật","期限：日曜23:59"],src:"Teams",who:"Giảng viên",more:["Nộp bài tập tuần qua mục Assignments trên Teams.","Teamsの課題欄から提出してください。"]},
{id:4,t:"n",vi:"Mang tai nghe cho buổi ITSS in Japanese 2",ja:"ITSS in Japanese 2に向けてヘッドホンを持参",due:["Hạn xem: trước 08:00 thứ Ba","確認期限：火曜8:00まで"],src:"Slack",who:"Giảng viên ITSS2",more:["Buổi phỏng vấn online cần tai nghe để nghe rõ.","オンライン面談のため、ヘッドホンが必要です。"]},
{id:5,t:"d",vi:"Nộp bài tập tiếng Nhật",ja:"日本語課題の提出",due:["Hạn: 23:59 thứ Sáu","期限：金曜23:59"],src:"Slack",who:"Giảng viên ITSS2",more:["Nộp bài tập tiếng Nhật trong kênh của lớp.","日本語の課題はクラスのチャンネルに提出してください。"]},
{id:6,t:"d",vi:"Bài tập môn Thiết kế ứng dụng di động",ja:"モバイルアプリ設計の課題",due:["Hạn: 23:59 Chủ nhật","期限：日曜23:59"],src:"Teams",who:"Giảng viên",more:["Nộp bản thiết kế và file giải thích lên Teams.","設計と説明ファイルをTeamsに提出してください。"]}];
const WEEKS=[["Tuần 1","第1週",20],["Tuần 2","第2週",40],["Tuần 3","第3週",70]];
const WHO={"Thầy Hùng":"フン先生","Cô Lan":"ラン先生","Giảng viên":"講師","Giảng viên ITSS2":"ITSS2の講師"};
const AUTO_SEC=8; // số giây chờ trước khi tự sang thông báo (A3→A4)
const LV=[0,40,80,120]; // ngưỡng XP của Lv1..Lv4
const TEAMS=[["Thầy Hùng (Mạng máy tính)","フン先生（コンピュータネットワーク）","Sáng thứ Hai tuần sau lớp nghỉ, sẽ học bù vào tuần sau.","月曜の朝は休講、補講は来週です。"],["Cô Lan (Lập trình mạng)","ラン先生（ネットワークプログラミング）","Đổi phòng học từ tuần sau: D9-301.","来週から教室はD9-301です。"]];
const SLACK=[["Giảng viên ITSS2","ITSS2の講師","Tuần sau nhớ mang tai nghe cho buổi phỏng vấn online.","来週のオンライン面談にヘッドホンを持参してください。"],["Giảng viên ITSS2","ITSS2の講師","Nhắc nộp bài tập tiếng Nhật trước 23:59 Chủ nhật.","日曜23:59までに日本語課題を提出してください。"]];

/* ===== TRẠNG THÁI (chỉ trong bộ nhớ) ===== */
let S,LANG="vi",CUR="S0",CDN=0; // LANG: "vi" hoặc "ja" (không bị reset khi bấm Làm lại)
const T=(vi,ja)=>LANG=="ja"?ja:vi;
function fresh(){S={reminders:[],draftBackup:null,slots:[{time:"20:00",days:[]}],times:["20:00"],repeat:"daily",days:[],saved:false,checkedAt:null,banner:false,xp:30,done:[],pre:4,streak:5,cur:null,last:null,tab:"Teams",after:null,fire:null};} // after: lời nhắc đã dùng xong; fire: lời nhắc đang hiện ở A4
fresh();
let timer=null;
const $=id=>document.getElementById(id);
const b=(vi,ja)=>`<span class="vi">${T(vi,ja)}</span>`;
const cdHTML=n=>b(`Tự nhắc sau ${n} giây`,`${n}秒後に自動通知`);
const pad=n=>String(n).padStart(2,"0");
const hm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const lvOf=x=>LV.filter(v=>x>=v).length;
const resetInner=()=>`↺ ${b("Làm lại từ đầu","最初から")}`;
// Nút "Làm lại" mặc định ẨN. Bật bằng: mở link có ?admin, hoặc chạm 3 lần vào góc trên-trái màn hình (chạm 3 lần nữa để tắt)
let ADMIN=/[?&]admin(=|&|$)/.test(location.search),tapN=0,tapT=null;
const resetLink=()=>ADMIN?`<div class="reset"><button onclick="resetTap(this)">${resetInner()}</button></div>`:"";
function hid(){tapN++;clearTimeout(tapT);tapT=setTimeout(()=>tapN=0,1200);
  if(tapN>=3){tapN=0;ADMIN=!ADMIN;re(CUR);toast(ADMIN?b("Chế độ người phỏng vấn: BẬT","インタビュアーモード：オン"):b("Chế độ người phỏng vấn: TẮT","インタビュアーモード：オフ"))}}
let rsT=null;
// Bấm 2 lần (trong 3 giây) để tránh lỡ tay làm mất trạng thái
function resetTap(el){
  if(el.dataset.arm){clearTimeout(rsT);resetAll();return}
  el.dataset.arm=1;el.innerHTML="↺ "+b("Bấm lần nữa để xác nhận","もう一度タップして確認");
  rsT=setTimeout(()=>{delete el.dataset.arm;el.innerHTML=resetInner()},3000);
}
function resetAll(){TASKS.splice(6);fresh();go("S0")}

/* ===== ĐIỀU HƯỚNG ===== */
const R={};
function go(id){CUR=id;
  clearInterval(timer);timer=null;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  const el=$(id);el.style.animation="";el.innerHTML=R[id]()+resetLink();el.classList.add("on");window.scrollTo(0,0);
  if(R[id+"_after"])R[id+"_after"]();
}
function toast(h){const t=$("toast");t.innerHTML=h;t.style.display="block";setTimeout(()=>t.style.display="none",2600)}
// Vẽ lại màn hình hiện tại: giữ vị trí cuộn, không chạy hiệu ứng trượt
function re(id){const y=window.scrollY,el=$(id);el.style.animation="none";el.innerHTML=R[id]()+resetLink();window.scrollTo(0,y);if(R[id+"_after"])R[id+"_after"]()}
function setLang(l){LANG=l;document.documentElement.lang=l;document.querySelectorAll("#lang button").forEach(x=>x.classList.toggle("on",x.dataset.l==l));re(CUR)}
const btn=(vi,ja,to,cls="")=>`<button class="btn ${cls}" onclick="${to}">${b(vi,ja)}</button>`;
const lnk=(vi,ja,to)=>`<button class="link" onclick="${to}">${b(vi,ja)}</button>`;
const home=()=>lnk("Về trang chủ","ホームへ","go('S0')"); // hàm, để đổi ngôn ngữ được

/* S0 */
R.S0=()=>`<div class="center big" style="margin-top:20px"><div class="art" style="font-size:64px">🌱</div>${b(APP_NAME[0],APP_NAME[1])}<div class="sm" style="margin-top:8px">${b("Không bỏ lỡ thông báo, nhẹ lòng học tập","お知らせを見逃さず、安心して学ぶ")}</div></div>
<div class="card tap" onclick="go('A1')"><div class="ico">⏰</div><div>${b("Nhắc kiểm tra","確認リマインダー")}</div></div>
<div class="card tap" onclick="go('B1')"><div class="ico g">📈</div><div>${b("Theo dõi tiến bộ","進捗確認")}</div></div>`;

/* ---- LUỒNG A ---- */
R.A1=()=>`<div class="sp"></div><div class="art">🕗✅</div><div class="center big">${b("Chọn giờ kiểm tra để an tâm tập trung","安心して集中するために確認時間を選ぶ")}</div><div class="sp"></div>${btn("Chọn giờ nhắc","時間を選ぶ","beginReminder()")}`;

R.A2=()=>`<div class="big">${b(S.saved?"Sửa lời nhắc":"Cài lời nhắc","リマインダー設定")}</div>
<div class="tabs"><button class="tab ${S.repeat!=='tkb'?'on':''}" onclick="S.repeat='custom';re('A2')">${T('Tự chọn giờ','時刻を指定')}</button><button class="tab ${S.repeat==='tkb'?'on':''}" onclick="S.repeat='tkb';re('A2')">${T('Theo TKB mẫu','サンプル時間割')}</button></div>

<div class="err" id="err" role="alert"></div><div class="sp"></div>${btn('Lưu lời nhắc','保存','saveSched()')}${lnk('Quay lại','戻る',"cancelReminder()")}`;
function beginReminder(){
  S.draftBackup={repeat:S.repeat,slots:S.slots.map(x=>({time:x.time,days:[...x.days]})),times:[...S.times]};
  go('A2');
}
function cancelReminder(){
  if(S.draftBackup){Object.assign(S,S.draftBackup);S.draftBackup=null}
  go(S.saved?'A3':'A1');
}
function addTime(){S.slots.push({time:'12:00',days:[]});re('A2')}
function rmTime(i){if(S.slots.length>1)S.slots.splice(i,1);re('A2')}
function togDay(i,d){const days=S.slots[i].days,index=days.indexOf(d);index<0?days.push(d):days.splice(index,1);re('A2')}
function saveSched(){
  if(S.repeat!=='tkb'){
    const bad=S.slots.findIndex(x=>!/^([01]\d|2[0-3]):[0-5]\d$/.test(x.time)||!x.days.length);
    const seen=new Set();let duplicate=false;S.slots.forEach(x=>x.days.forEach(d=>{const k=d+':'+x.time;if(seen.has(k))duplicate=true;seen.add(k)}));
    if(bad>=0||duplicate){$('err').innerHTML=bad>=0?b(`Mốc ${bad+1}: hãy chọn giờ và ít nhất một ngày.`,`時刻${bad+1}：時刻と曜日を選択してください。`):b('Có mốc trùng giờ và ngày. Hãy điều chỉnh hoặc xóa mốc trùng.','同じ曜日・時刻が重複しています。');$('err').style.display='block';return}
    S.repeat='custom';S.times=S.slots.map(x=>x.time);
  }
  S.reminders=[{repeat:S.repeat,slots:S.slots.map(x=>({time:x.time,days:[...x.days]}))}];S.draftBackup=null;
  S.saved=true;S.checkedAt=null;S.banner=false;S.after=null;S.fire=null;S.fromSave=true;go('A3');
}
// Tính lần nhắc tiếp theo từ giờ thiết bị
function nextRemind(){
  const now=new Date(),L=[],lim=S.after&&S.after>now?S.after:now; // chỉ lấy lời nhắc SAU lời nhắc đã dùng xong
  for(let k=0;k<15;k++){
    const d=new Date(now);d.setDate(now.getDate()+k);const wd=d.getDay();let ts=[];
    const reminders=S.reminders.length?S.reminders:[{repeat:S.repeat,slots:S.slots}];
    reminders.forEach(r=>{if(r.repeat==='tkb'){const t=TKB.find(x=>x.d===wd);if(t)ts.push(t.rm)}else ts.push(...r.slots.filter(x=>x.days.includes(wd)).map(x=>x.time))});
    ts.forEach(t=>{const[h,m]=t.split(":");const x=new Date(d);x.setHours(+h,+m,0,0);if(x>lim)L.push(x)});
  }
  L.sort((a,b)=>a-b);
  const c=L[0];
  if(!c)return{vi:"—",ja:"—",hm:"--:--",date:null};
  const k=Math.round((new Date(c).setHours(0,0,0,0)-new Date(now).setHours(0,0,0,0))/864e5);
  const n=DAYS.find(z=>z[1]==c.getDay())[0],nj="日月火水木金土"[c.getDay()];
  const vi=k==0?"Hôm nay":k==1?"Ngày mai":n,ja=k==0?"今日":k==1?"明日":nj;
  return{vi:`${vi} ${hm(c)}`,ja:`${ja} ${hm(c)}`,hm:hm(c),date:c};
}
function summary(){
  const reminders=S.reminders.length?S.reminders:[{repeat:S.repeat,slots:S.slots}];
  return ['vi','ja'].map(lang=>reminders.map(r=>r.repeat==='tkb'?(lang==='vi'?'30 phút trước tiết đầu · TKB mẫu':'最初の授業の30分前・サンプル時間割'):r.slots.map(x=>`${x.time} · ${x.days.length===7?(lang==='vi'?'Hằng ngày':'毎日'):DAYS.filter(d=>x.days.includes(d[1])).map(d=>lang==='vi'?d[0]:'日月火水木金土'[d[1]]).join(', ')}`).join(' / ')).join(' / '));
}

function finish(){

  S.last={lvUp:lvOf(S.xp)>oldLv,lv:lvOf(S.xp),badge:oldPre<5&&S.pre>=5,from:S.xp-10};

}
